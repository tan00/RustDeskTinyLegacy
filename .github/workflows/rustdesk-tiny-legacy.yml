name: Build RustDeskTinyLegacy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/patches/**"
      - ".github/workflows/rustdesk-tiny-legacy.yml"
      - "flutter/**"
      - "libs/**"
      - "res/**"
      - "scripts/build-windows-legacy.ps1"
      - "src/**"
      - "build.py"
      - "build.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "vcpkg.json"

permissions:
  contents: read

concurrency:
  group: rustdesk-tiny-legacy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  LLVM_VERSION: "15.0.6"
  RUST_VERSION: "1.75"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Export libclang path
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:LLVM_PATH\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Patch Flutter
        shell: bash
        run: |
          flutter_root=$(dirname "$(dirname "$(which flutter)")")
          git -C "$flutter_root" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Stage Flutter SDK where build-windows-legacy.ps1 expects it
        shell: pwsh
        run: |
          $flutterRoot = (Get-Command flutter).Source | Split-Path -Parent | Split-Path -Parent
          $target = Join-Path $env:GITHUB_WORKSPACE '..\.build-tools\flutter-sdk-3.24.5\flutter'
          New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force | Out-Null
          & robocopy.exe $flutterRoot $target /E /MT:16 /R:2 /W:1 /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) {
            throw "Flutter SDK staging failed with robocopy exit code $LASTEXITCODE"
          }
          exit 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-x86_64-tiny-legacy

      - name: Install Flutter Rust bridge code generator
        shell: bash
        run: cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_VERSION" --features uuid --locked

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build RustDeskTinyLegacy
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'build-windows-legacy.log'
          New-Item -ItemType File -Path $log -Force | Out-Null
          & .\scripts\build-windows-legacy.ps1 -PythonPath python *> $log
          $code = $LASTEXITCODE
          $output = Get-Content -LiteralPath $log
          $output
          if ($code -ne 0) {
            $output | Select-Object -Last 200 | ForEach-Object {
              Write-Host "::error::$($_)"
            }
            exit $code
          }

      - name: Upload Windows build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RustDeskTinyLegacy-windows-build-diagnostics
          if-no-files-found: warn
          path: build-windows-legacy.log

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RustDeskTinyLegacy-windows-x86_64
          if-no-files-found: error
          path: |
            dist/windows-x64-release/**
            dist/RustDeskTinyLegacy-install.exe
